<body>
  <nav>
    <a href="index.html" class="logo"><span><</span>Akash.AI<span>/></span></a>
    <div class="nav-links">
      <a href="https://substack.com/@akashsaini12740" target="_blank" style="color:var(--accent);">Subscribe on Substack ↗</a>
      <a href="index.html">← Back to Portfolio</a>
    </div>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">☀️ Light</button>
  </nav>

  <div class="container" style="padding-top:3rem; padding-bottom:4rem; max-width:900px;">
    <span class="section-tag">// AUTOMATED_DAILY_TECHNICAL_PUBLICATIONS</span>
    <h1>AI, Machine Learning & Data Science Blog</h1>
    <p class="hero-desc">Dynamically rendered from <code>data/posts.json</code> and updated daily via GitHub Actions.</p>

    <input type="text" id="blogSearch" class="pg-input" placeholder="Search articles by keyword (e.g., RAG, SARIMA, Regularization)..." oninput="renderBlogArchive(window.curTopic || 'all', this.value)" />

    <div class="filter-bar">
      <button class="filter-btn active" onclick="window.curTopic='all'; setActive(this); renderBlogArchive('all', document.getElementById('blogSearch').value)">All Topics</button>
      <button class="filter-btn" onclick="window.curTopic='ai'; setActive(this); renderBlogArchive('ai', document.getElementById('blogSearch').value)">AI</button>
      <button class="filter-btn" onclick="window.curTopic='ml'; setActive(this); renderBlogArchive('ml', document.getElementById('blogSearch').value)">Machine Learning</button>
      <button class="filter-btn" onclick="window.curTopic='ds'; setActive(this); renderBlogArchive('ds', document.getElementById('blogSearch').value)">Data Science</button>
      <button class="filter-btn" onclick="window.curTopic='da'; setActive(this); renderBlogArchive('da', document.getElementById('blogSearch').value)">Data Analytics</button>
      <button class="filter-btn" onclick="window.curTopic='llm'; setActive(this); renderBlogArchive('llm', document.getElementById('blogSearch').value)">LLMs & RAG</button>
    </div>

    <div id="all-blogs-list"></div>
  </div>

  <footer>© 2026 AKASH SAINI • ENGINEERING BLOG • AKASH12740.GITHUB.IO</footer>
  <script>function setActive(b){document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');}</script>
  <script src="assets/js/app.js"></script>
